# ============================================================
# RAIYAN // CLASSIC HACKER TERMINAL
# ============================================================

# Shell
shell /usr/bin/zsh

# Font
font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 12

# Window
window_padding_width 14
window_padding_height 12

background_opacity 0.90
dynamic_background_opacity yes

hide_window_decorations yes
confirm_os_window_close 0

# Cursor
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.6

# Scrollback
scrollback_lines 10000

# Bell
enable_audio_bell no
visual_bell_duration 0

# Wayland
linux_display_server wayland


# ============================================================
#                     HACKER COLORS
# ============================================================

# Pure dark terminal
background #000800

# Main hacker green
foreground #00FF41

# Cursor
cursor #00FF41
cursor_text_color #000800

# Selection
selection_background #003B18
selection_foreground #39FF75


# ============================================================
#                    ANSI COLORS
# ============================================================

# Black
color0  #000800
color8  #063D16

# Red
color1  #FF3B30
color9  #FF6259

# Green
color2  #00FF41
color10 #39FF75

# Yellow
color3  #A8FF00
color11 #C8FF5A

# Blue
color4  #008F11
color12 #00C928

# Magenta
color5  #00B140
color13 #00FF66

# Cyan
color6  #00CC44
color14 #39FF88

# White
color7  #7CFF9B
color15 #B8FFC8


# ============================================================
#                         LINKS
# ============================================================

url_color #00FF41
underline_hyperlinks always


# ============================================================
#                    SHELL INTEGRATION
# ============================================================

shell_integration enabled


# ============================================================
#                       PERFORMANCE
# ============================================================

repaint_delay 8
input_delay 0
sync_to_monitor yes


# ============================================================
#                        CLIPBOARD
# ============================================================

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


# ============================================================
#                           TABS
# ============================================================

tab_bar_edge bottom
tab_bar_style powerline
tab_title_template "{index}: {title}"


# ============================================================
#                    TRANSPARENCY
# ============================================================

map ctrl+shift+up increase_background_opacity
map ctrl+shift+down decrease_background_opacity
map ctrl+shift+0 set_background_opacity 1