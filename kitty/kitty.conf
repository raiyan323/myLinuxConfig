# Shell
shell /usr/bin/zsh

# Font
font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 12

# Window
window_padding_width 14
window_padding_height 12

background_opacity 0.82
dynamic_background_opacity yes

# Clean terminal
hide_window_decorations yes
confirm_os_window_close 0

# Cursor
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.6

# Scrollback
scrollback_lines 10000

# Bell
enable_audio_bell no
visual_bell_duration 0

# Wayland
linux_display_server wayland

# ───────── COLORS ─────────

background #0B1113
foreground #D7E5E3

cursor #A7E3DD
cursor_text_color #0B1113

selection_background #244342
selection_foreground #E4F5F2

# Black
color0  #0B1113
color8  #526362

# Red
color1  #FFB4AB
color9  #FFB4AB

# Green
color2  #A8D5BA
color10 #B7E7C8

# Yellow
color3  #E6D08A
color11 #F0DD9B

# Blue
color4  #AFC9FF
color12 #BDD5FF

# Magenta
color5  #DDB8F4
color13 #E8C9FF

# Cyan
color6  #9EDBD5
color14 #B5F1EA

# White
color7  #D7E5E3
color15 #F1FFFC

# Links
url_color #A7E3DD
underline_hyperlinks always

# Shell integration
shell_integration enabled

# Performance
repaint_delay 8
input_delay 0
sync_to_monitor yes

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_title_template "{index}: {title}"

# Transparency controls
map ctrl+shift+up increase_background_opacity
map ctrl+shift+down decrease_background_opacity
map ctrl+shift+0 set_background_opacity 1


