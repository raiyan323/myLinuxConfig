# ============================================================
# RAIYAN // CYBERPUNK KITTY TERMINAL
# ============================================================

# ───────── SHELL ─────────

shell /usr/bin/zsh


# ───────── FONT ─────────

font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 12


# ───────── WINDOW ─────────

window_padding_width 14
window_padding_height 12

background_opacity 0.88
dynamic_background_opacity yes

hide_window_decorations yes
confirm_os_window_close 0


# ───────── CURSOR ─────────

cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.55


# ───────── SCROLLBACK ─────────

scrollback_lines 10000


# ───────── BELL ─────────

enable_audio_bell no
visual_bell_duration 0


# ───────── WAYLAND ─────────

linux_display_server wayland


# ============================================================
#                    CYBERPUNK PALETTE
# ============================================================

# Deep black / green terminal
background #03070B
foreground #C7D9D6

# Neon hacker cursor
cursor #39FF88
cursor_text_color #03070B

# Selection
selection_background #12352A
selection_foreground #DFFFF0


# ───────── BLACK ─────────

color0  #03070B
color8  #344B46


# ───────── RED ─────────

color1  #FF5577
color9  #FF6B8A


# ───────── GREEN ─────────

# Hacker green
color2  #39FF88
color10 #65FFAA


# ───────── YELLOW ─────────

color3  #E6F26A
color11 #F3FF8A


# ───────── BLUE ─────────

color4  #35A7FF
color12 #65C3FF


# ───────── MAGENTA ─────────

color5  #D65CFF
color13 #E58AFF


# ───────── CYAN ─────────

# Cyber neon
color6  #22D3EE
color14 #67E8F9


# ───────── WHITE ─────────

color7  #C7D9D6
color15 #E8FFF8


# ============================================================
#                         LINKS
# ============================================================

url_color #39FF88
underline_hyperlinks always


# ============================================================
#                     SHELL INTEGRATION
# ============================================================

shell_integration enabled


# ============================================================
#                       PERFORMANCE
# ============================================================

repaint_delay 8
input_delay 0
sync_to_monitor yes


# ============================================================
#                        CLIPBOARD
# ============================================================

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


# ============================================================
#                           TABS
# ============================================================

tab_bar_edge bottom
tab_bar_style powerline

tab_title_template "{index}: {title}"


# ============================================================
#                  TRANSPARENCY CONTROLS
# ============================================================

map ctrl+shift+up increase_background_opacity
map ctrl+shift+down decrease_background_opacity
map ctrl+shift+0 set_background_opacity 1