# ============================================================
# RAIYAN // NEXUS HACKER
# MODERN CYBER SECURITY • DARK TERMINAL • FUTURISTIC UNIX
# ============================================================

# ───────── SHELL ─────────

shell /usr/bin/zsh


# ───────── FONT ─────────

font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Italic

font_size 12


# ───────── WINDOW ─────────

window_padding_width 10
window_padding_height 10

background_opacity 0.94
dynamic_background_opacity yes

hide_window_decorations yes
confirm_os_window_close 0


# ───────── CURSOR ─────────

cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.55

# Electric cyan
cursor #39E8FF
cursor_text_color #05090D


# ───────── SCROLLBACK ─────────

scrollback_lines 10000


# ───────── BELL ─────────

enable_audio_bell no
visual_bell_duration 0


# ───────── WAYLAND ─────────

linux_display_server wayland


# ============================================================
#                    MODERN DARK PALETTE
# ============================================================

# Almost-black blue graphite
background #05090D

# Cool white with subtle cyan tint
foreground #D5E5EA


# ============================================================
#                       SELECTION
# ============================================================

selection_background #102D35
selection_foreground #E5FBFF


# ============================================================
#                     ANSI COLORS
# ============================================================

# ───────── BLACK ─────────

color0  #05090D
color8  #33464D


# ───────── RED ─────────

# Error / danger
color1  #FF5268
color9  #FF7183


# ───────── GREEN ─────────

# Success / shell output
color2  #35D39A
color10 #5BE8B0


# ───────── YELLOW ─────────

# Warning
color3  #D6C86A
color11 #F0DF7D


# ───────── BLUE ─────────

# System / information
color4  #3D9FE8
color12 #63BFFF


# ───────── MAGENTA ─────────

color5  #A978D8
color13 #C69AF2


# ───────── CYAN ─────────

# Primary hacker accent
color6  #27D7ED
color14 #67ECFF


# ───────── WHITE ─────────

color7  #9FB6BE
color15 #ECF8FA


# ============================================================
#                         LINKS
# ============================================================

url_color #52E8FF
underline_hyperlinks always


# ============================================================
#                    SHELL INTEGRATION
# ============================================================

shell_integration enabled


# ============================================================
#                       PERFORMANCE
# ============================================================

repaint_delay 8
input_delay 0
sync_to_monitor yes


# ============================================================
#                        CLIPBOARD
# ============================================================

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


# ============================================================
#                           TABS
# ============================================================

tab_bar_edge bottom
tab_bar_style powerline

tab_title_template "{index}: {title}"


# ============================================================
#                    OPACITY CONTROLS
# ============================================================

map ctrl+shift+up increase_background_opacity
map ctrl+shift+down decrease_background_opacity
map ctrl+shift+0 set_background_opacity 1