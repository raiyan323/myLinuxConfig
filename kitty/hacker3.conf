# ╭──────────────────────────────────────────────╮
# │              KITTY — MODERN HACKER           │
# ╰──────────────────────────────────────────────╯


# ── Font ────────────────────────────────────────

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

font_size 12.0

disable_ligatures never


# ── Window ──────────────────────────────────────

background_opacity 0.90

window_padding_width 14
window_padding_height 12

hide_window_decorations yes

dynamic_background_opacity yes


# ── Core Colors ─────────────────────────────────

background #000000
foreground #63e6be

cursor #39ff88
cursor_shape block
cursor_blink_interval 0.5

selection_background #10352f
selection_foreground #a7fff0


# ── ANSI Palette ────────────────────────────────

# Black
color0 #000000

# Red — muted
color1 #8f4545

# Green — primary
color2 #32c76b

# Yellow — muted
color3 #8f9848

# Blue — cyan-blue
color4 #347f91

# Magenta — muted
color5 #705687

# Cyan — primary
color6 #22d3ee

# White — green tinted
color7 #9de8c5


# ── Bright Colors ───────────────────────────────

color8  #15201c
color9  #ff5f5f
color10 #39ff88
color11 #c7e86b
color12 #4dcfff
color13 #a878ff
color14 #67f7ff
color15 #d8fff0


# ── Scrollback ──────────────────────────────────

scrollback_lines 10000


# ── Mouse ───────────────────────────────────────

mouse_hide_wait 3.0


# ── Clipboard ───────────────────────────────────

copy_on_select no


# ── URL / Links ─────────────────────────────────

url_color #22d3ee
url_style curly


# ── Bell ────────────────────────────────────────

enable_audio_bell no
visual_bell_duration 0.0


# ── Performance ─────────────────────────────────

repaint_delay 10
input_delay 3


# ── Shell ───────────────────────────────────────

shell /bin/zsh