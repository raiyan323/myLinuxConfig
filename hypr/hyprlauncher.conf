

general {
    # Grab full keyboard focus when opened
    grab_focus = true
}


# ───────────────── CACHE ────────────────────

cache {
    # Remember frequently used applications
    enabled = true
}


# ──────────────── FINDERS ───────────────────

finders {
    # Default search mode
    default_finder = desktop

    # Application search
    desktop_prefix = ""

    # Unicode / emoji search
    unicode_prefix = ""

    # Calculator
    # Example: =2+2
    math_prefix = "="

    # Font search
    # Example: 'JetBrains
    font_prefix = "'"

    # Launch applications through uwsm
    # Uncomment if you use uwsm:
    # desktop_launch_prefix = "uwsm app --"
    desktop_launch_prefix = ""

    # Show application icons
    desktop_icons = true
}


# ─────────────────── UI ─────────────────────

ui {
    # Width × Height
    # Compact and comfortable launcher size
    window_size = 700 420
}



