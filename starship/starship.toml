# ============================================================
# RAIYAN // HACKER STARSHIP
# ============================================================

add_newline = false

format = """
[╭─](bold green)[\\[](bold green)$username[@](bold green)$hostname[\\]](bold green)[─](bold green)[\\[](bold green)$directory[\\]](bold green)$git_branch$git_status
[╰─](bold green)$character"""

# ============================================================
# USER
# ============================================================

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

# ============================================================
# HOST
# ============================================================

[hostname]
ssh_only = false
style = "bold green"
format = "[$hostname]($style)"

# ============================================================
# DIRECTORY
# ============================================================

[directory]
style = "bold green"
format = "─[\\[$path\\]]($style)"
truncation_length = 3
truncate_to_repo = false
home_symbol = "~"

# ============================================================
# GIT
# ============================================================

[git_branch]
symbol = "󰊢 "
style = "bold green"
format = "─[\\[$symbol$branch\\]]($style)"

[git_status]
style = "bold green"
format = "[$all_status$ahead_behind]($style)"

conflicted = "!"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# ============================================================
# PROMPT
# ============================================================

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# ============================================================
# DISABLE UNNECESSARY MODULES
# ============================================================

[cmd_duration]
disabled = true

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[docker_context]
disabled = true

[sudo]
disabled = true