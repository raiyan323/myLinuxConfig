"$schema" = "https://starship.rs/config-schema.json"

# ============================================================
# RAIYAN // ARCH MODERN HACKER
# ============================================================

add_newline = false

format = """
[┌─](bold green)[\\[](bold green)$username$hostname[\\]](bold green)[ :: ](dimmed green)[\\[](dimmed green)$directory$git_branch$git_status[\\]](dimmed green)
[└─](bold green)$character"""

palette = "hacker"

# ============================================================
# COLORS
# ============================================================

[palettes.hacker]
green = "#00ff66"
cyan = "#00e5ff"
purple = "#b56cff"
yellow = "#d7ff00"
red = "#ff3b3b"
white = "#e6e6e6"
gray = "#666666"

# ============================================================
# USER
# ============================================================

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[ 󰣇 $user@]($style)"

# ============================================================
# HOST
# ============================================================

[hostname]
ssh_only = false
style = "bold green"
format = "[$hostname ]($style)"

# ============================================================
# DIRECTORY
# ============================================================

[directory]
style = "bold cyan"
format = "[$path]($style)"
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"
read_only = " "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ============================================================
# GIT
# ============================================================

[git_branch]
symbol = "󰊢 "
style = "bold purple"
format = "[ $symbol$branch]($style)"

[git_status]
style = "bold yellow"
format = "[$all_status$ahead_behind]($style)"

conflicted = "!"
ahead = " ⇡"
behind = " ⇣"
diverged = " ⇕"
untracked = " ?"
modified = " !"
staged = " +"
renamed = " »"
deleted = " ✘"
up_to_date = ""

# ============================================================
# LANGUAGES
# ============================================================

[c]
symbol = " "
style = "bold cyan"
format = "[$symbol$version]($style) "

[cpp]
symbol = " "
style = "bold cyan"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "bold yellow"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "

[bun]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol$version]($style) "

[php]
symbol = " "
style = "bold purple"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

[kotlin]
symbol = " "
style = "bold purple"
format = "[$symbol$version]($style) "

[haskell]
symbol = " "
style = "bold purple"
format = "[$symbol$version]($style) "

# ============================================================
# DOCKER
# ============================================================

[docker_context]
symbol = " "
style = "bold cyan"
format = "[$symbol$context]($style) "

# ============================================================
# CONDA / PIXI
# ============================================================

[conda]
style = "bold green"
format = "[conda:$environment]($style) "

[pixi]
style = "bold green"
format = "[pixi:$environment]($style) "

# ============================================================
# PROMPT
# ============================================================

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold cyan)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

# ============================================================
# DISABLED / CLEAN
# ============================================================

[os]
disabled = true

[time]
disabled = true

[cmd_duration]
disabled = true

[package]
disabled = true

[sudo]
disabled = true

[jobs]
disabled = true

[status]
disabled = true

[line_break]
disabled = false