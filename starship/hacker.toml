# ============================================================
# ADVANCED MATRIX / KALI STARSHIP
# Prompt structure: UNCHANGED
# ============================================================

add_newline = true

format = """
[┌──\\(](bold green)[$username](bold bright-green)[@](bold green)[$hostname](bold bright-green)[\\)](bold green)-[\\[](bold green)$directory[\\]](bold green) $git_branch $git_status $python $rust $nodejs $cmd_duration
[└──](bold bright-green) $character"""

# ============================================================
# USER
# ============================================================

[username]
style_user = "bold bright-green"
style_root = "bold bright-red"
format = "$user"
disabled = false
show_always = true

# ============================================================
# HOST
# ============================================================

[hostname]
ssh_only = false
format = "$hostname"
disabled = false
style = "bold bright-green"

# ============================================================
# DIRECTORY
# ============================================================

[directory]
style = "bold bright-green"
format = "$path"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

home_symbol = "󰋜 ~"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = "󰉍 Downloads"
"Pictures" = "󰉏 Pictures"
"Music" = "󰝚 Music"
"Videos" = "󰕧 Videos"
".config" = "󰒓 .config"
"Desktop" = "󰇄 Desktop"

# ============================================================
# GIT BRANCH
# ============================================================

[git_branch]
format = " [$symbol$branch]($style)"
symbol = "󰘬 "
style = "bold bright-green"

# ============================================================
# GIT STATUS
# ============================================================

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'
style = "bold bright-yellow"

conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# ============================================================
# PYTHON
# ============================================================

[python]
symbol = " "
format = "[$symbol$virtualenv]($style)"
style = "bold bright-yellow"

[rust]
symbol = " "
format = "[$symbol]($style)"
style = "bold bright-red"

[nodejs]
symbol = " "
format = "[$symbol]($style)"
style = "bold bright-green"



# ============================================================
# COMMAND DURATION
# ============================================================

[cmd_duration]
min_time = 2000
format = " [󰔟 $duration]($style)"
style = "bold bright-yellow"
disabled = false

# ============================================================
# CHARACTER
# ============================================================

[character]
success_symbol = "[\\$](bold bright-green)"
error_symbol = "[\\$](bold bright-red)"
vimcmd_symbol = "[\\$](bold bright-yellow)"
